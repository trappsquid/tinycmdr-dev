# The gate: one workflow, three platforms, one command per job.
#
# The tree had no CI at all, so every "45/45 green" in the changelog was a hand run
# with no exit code behind it - and eight suites were quietly red on the author's own
# Mac (BUGREPORT T1); six of them on this host. Each job below is
# `python tests/run_all.py` (or a --select of it) and nothing else: the runner is the
# gate, CI only gives it a machine.
#
# A SKIP is a failure here on purpose. Three suites used to print a skip line and
# return 0 when their subject was absent (a missing dependency, a chatless build), so
# a machine that graded nothing reported success; now they exit 77 and run_all.py
# counts that as red unless a developer passes --allow-skips, which no step below does.
#
# What the gate says today: measured on a clean clone on macOS 2026-09-26,
# `python tests/run_all.py` reports 0 failed, 0 skipped (see the tail in the G2 batch's
# changelog note). Nothing is staged by hand any more: tests/test_config_example.py stages
# maintenance/private_rules.example.py as private_rules.py on sys.path itself, and
# tests/test_digest.py stages the field-notes library from tests/fixture-field-notes.md, so
# a clone grades itself without writing into the checkout - which the runner's own leak
# report would flag. The runner splits that report per suite: a suite that writes into the
# tree instead of its own temp dir is named, with the path it touched.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS + Linux: the whole sweep. These are the platforms Phase 1 touches.
  unix:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_status.py decides "shipped" with `git tag --contains`, and the default
          # fetch-depth of 1 brings no tags: the check would fail on a clone that is fine.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install requirements.txt + requirements-test.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: gate
        run: python tests/run_all.py

  # Windows: the suites that are known to pass here, plus the ones that branch on the platform.
  #
  # The original selection was the six suites certain to pass on a Windows runner, because this
  # job was [READ]-verified - Phase 1's Windows fixes were reasoned, not executed. The cost was
  # that none of the suites which actually SWITCH on IS_WINDOWS ran here: the platform-specific
  # behaviour was the one thing Windows CI never exercised.
  #
  # 2026-09-29: the candidates were triaged by how each suite names the platform. These are the
  # ones that write an IS_WINDOWS branch at the platform-specific point (findstr vs grep, the
  # child-command quoting in test_stall, the visibility/desktop paths, the installer checks), so
  # adding them is what turns "reasoned" into "executed". A suite that cannot run here exits 77,
  # which the gate counts as red, so this list grows one addition at a time and never shrinks by
  # silencing a suite.
  windows:
    name: windows / pure-python suites
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_status.py decides "shipped" with `git tag --contains`, and the default
          # fetch-depth of 1 brings no tags: the check would fail on a clone that is fine.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: gate (ledger, events, config example, tool discovery + the IS_WINDOWS suites)
        run: >
          python tests/run_all.py
          --select tests/test_ledger*.py
          --select tests/test_events.py
          --select tests/test_config_example.py
          --select tests/test_tool_discovery.py
          --select tests/test_status.py
          --select tests/test_route_hint.py
          --select tests/test_stall.py
          --select tests/test_stop_now.py
          --select tests/test_checkin.py
          --select tests/test_endpoint_gate.py
          --select tests/test_installer_windows.py

  # The one loop no suite closes: build the package, install FROM the artifact it produces,
  # and run it. tests/test_installer_*.py install from a tree the suite assembles itself, so
  # until this job the zip and tarball every other host downloads were never executed - the
  # "installs and runs" claim had no exit code behind it. maintenance/smoke-install.sh builds
  # the public package, unpacks it, installs headless, then maintenance/smoke-install.py
  # drives doctor, health and a --once turn against a model endpoint.
  #
  # The endpoint is a hermetic stub by default, so this grades the artifact on a clean runner
  # with no model. Set the repository secret TINYCMDR_SMOKE_BASE_URL (and variable
  # TINYCMDR_SMOKE_MODEL) to run the same turn against a real endpoint instead - the value is
  # never written into this file, because a LAN address in a tracked file is exactly what
  # maintenance/leak-gate.py refuses. A LAN endpoint is only reachable from a runner on that
  # network; on GitHub-hosted runners leave the secret unset and the stub runs.
  install:
    name: install from the built package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      TINYCMDR_SMOKE_BASE_URL: ${{ secrets.TINYCMDR_SMOKE_BASE_URL }}
      TINYCMDR_SMOKE_MODEL: ${{ vars.TINYCMDR_SMOKE_MODEL }}
      TINYCMDR_BUILD_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build-package.py's payload-floor probe imports the app, which needs requests;
      # without it the build still succeeds but prints "PROBE FAILED" instead of the
      # floor it is there to measure.
      - run: python -m pip install requests
      - name: build, install from the artifact, smoke it
        run: bash maintenance/smoke-install.sh

  # Windows has no bash door, so the same three steps are spelled out here. install-tinycmdr.ps1
  # gets -SkipTask (files only, no scheduled task) and -NoPath, the analogues of the macos
  # --no-launchd --no-path, and then the install is handed to the same cross-platform smoke.
  install-windows:
    name: install from the built package / windows
    runs-on: windows-latest
    env:
      TINYCMDR_SMOKE_BASE_URL: ${{ secrets.TINYCMDR_SMOKE_BASE_URL }}
      TINYCMDR_SMOKE_MODEL: ${{ vars.TINYCMDR_SMOKE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: build the public package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\rules" | Out-Null
          Copy-Item maintenance\private_rules.example.py "$env:RUNNER_TEMP\rules\private_rules.py"
          $env:PYTHONPATH = "$env:RUNNER_TEMP\rules"
          python maintenance\build-package.py --public
      - name: unpack and install from the archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\tinycmdr-*-win.zip | Sort-Object LastWriteTime | Select-Object -Last 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\pkg" -Force
          $pkg = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Directory | Select-Object -First 1
          & "$($pkg.FullName)\install\install-tinycmdr.ps1" -NonInteractive -SkipTask -NoPath -NoPause `
              -InstallDir "$env:RUNNER_TEMP\inst" -Python (Get-Command python).Source
      - name: smoke the install
        shell: pwsh
        run: |
          python maintenance\smoke-install.py --install-dir "$env:RUNNER_TEMP\inst" `
              --python "$env:RUNNER_TEMP\inst\venv\Scripts\python.exe"
