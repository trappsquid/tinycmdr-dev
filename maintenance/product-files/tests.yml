# The product's own gate: a reader can see, on every push, that the suites in this tree pass.
#
# This is the only workflow that ships. The development repository - the ledger, the release
# tooling, the leak gate and the suites that grade them - keeps its own, private.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows runs everything the other two runners do, MINUS the suites that are red
          # there and named in STATUS.json's `windows-tier-on-the-install-surface` item.
          # tests/test_contracts.py fails when this list and that item disagree, so an
          # exclusion cannot be silent, and the item closes only when the list is empty.
          # (~84 suites still run on Windows - this keeps that coverage instead of cutting the
          # job back to the dev workflow's small curated tier.)
          - os: windows-latest
            python: "3.12"
            exclude: >-
              --exclude tests/test_compaction_continuity.py
              --exclude tests/test_cross_process.py
              --exclude tests/test_guard_battery.py
              --exclude tests/test_lane_health.py
              --exclude tests/test_patch_bytes.py
              --exclude tests/test_plan_and_context.py
              --exclude tests/test_tool_doors.py
              --exclude tests/test_tui.py
              --exclude tests/test_verbs.py
              --exclude tests/test_webui.py
              --exclude tests/test_update_script.py
          - os: macos-latest
            python: "3.12"
            exclude: ""
          - os: ubuntu-latest
            python: "3.12"
            exclude: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: every suite
        run: python tests/run_all.py ${{ matrix.exclude }}
