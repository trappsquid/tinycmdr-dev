# The product's own gate: a reader can see, on every push, that the suites in this tree pass.
#
# This is the only workflow that ships. The development repository - the ledger, the release
# tooling, the leak gate and the suites that grade them - keeps its own, private.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows set is named by TIER, from tests/windows-tier.json in this tree - the
          # one place it is stated (the same file the development repo's own Windows jobs read,
          # so the two cannot drift). tests/test_contracts.py grades that the file covers every
          # suite exactly once and that its `excluded` entries match STATUS.json's item, so an
          # exclusion cannot be silent.
          - os: windows-latest
            python: "3.12"
            jobs: 3
            gate: --tier windows
          - os: macos-latest
            python: "3.12"
            jobs: 3
            gate: ""
          - os: ubuntu-latest
            python: "3.12"
            jobs: 4
            gate: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      # --jobs: the suite run is the whole job (measured 2026-10-08: 391s of a 399s ubuntu
      # job), and macOS never finished inside the run's concurrency window without it.
      - name: every suite
        run: python tests/run_all.py --jobs ${{ matrix.jobs }} ${{ matrix.gate }}
